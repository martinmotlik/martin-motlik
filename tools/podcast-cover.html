<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Podcast cover generator</title>
<!-- Draws the podcast cover, design "O · Ripple", tone InsightsLight (handoff:
     design_handoff_insights_podcast/PodcastCover.dc.html), on a 360 × 360
     artboard scaled to the export size. Used for the files platforms and
     social previews need (3000 px PNG master, JPG renditions); the animated
     cover on /insights/podcast/ is the same design in HTML/CSS.
     Open it in a browser; the buttons download the images. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=block" rel="stylesheet">
<style>
  body{margin:0;padding:24px;background:#f5f6fa;font:14px Inter,system-ui,sans-serif;color:#1c2a33}
  .row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  canvas{display:block;width:360px;height:360px;border-radius:22px;box-shadow:0 1px 2px rgba(28,42,51,.06),0 18px 44px -22px rgba(28,42,51,.3)}
  .small canvas{width:72px;height:72px;border-radius:6px}
  button{font:inherit;font-weight:600;margin:12px 8px 0 0;padding:8px 14px;border-radius:999px;border:0;background:#1a56db;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="row">
  <div><canvas id="show" width="1080" height="1080"></canvas><button data-tag="PODCAST">Download PODCAST (3000 PNG)</button></div>
  <div><canvas id="ep" width="1080" height="1080"></canvas><button data-tag="EP 01">Download EP 01 (3000 PNG)</button></div>
  <div class="small"><p>At app size:</p><canvas id="s1" width="216" height="216"></canvas></div>
</div>
<script>
const A = 360;                                     // design artboard
const INK = '#1C2A33', TEXT2 = '#4B5563', ACCENT = '#1A56DB';
const load = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });

// CSS linear-gradient(<deg>) on a box, as a canvas gradient
function cssLinear(ctx, deg, x, y, w, h, stops) {
  const r = deg * Math.PI / 180, dx = Math.sin(r), dy = -Math.cos(r);
  const len = Math.abs(w * dx) + Math.abs(h * dy), cx = x + w / 2, cy = y + h / 2;
  const g = ctx.createLinearGradient(cx - dx * len / 2, cy - dy * len / 2, cx + dx * len / 2, cy + dy * len / 2);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}

function draw(canvas, tag, img) {
  const ctx = canvas.getContext('2d'), k = canvas.width / A;
  ctx.save(); ctx.scale(k, k);
  // Background: radial-gradient(60% 55% at 0% 0%, #FBF7FF, transparent 70%), linear-gradient(165deg, #FFF, #E6EBFC)
  ctx.fillStyle = cssLinear(ctx, 165, 0, 0, A, A, [[0, '#FFFFFF'], [1, '#E6EBFC']]); ctx.fillRect(0, 0, A, A);
  ctx.save(); const rx = .6 * A, ry = .55 * A; ctx.scale(1, ry / rx);
  const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); rg.addColorStop(0, 'rgba(251,247,255,1)'); rg.addColorStop(.7, 'rgba(251,247,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, A, A * rx / ry); ctx.restore();
  // Rings around the disc (centre 250, 262)
  [[189.5, 1, .14], [159.5, 1, .26], [129.25, 1.5, .45]].forEach(([r, w, a]) => {
    ctx.beginPath(); ctx.arc(250, 262, r, 0, Math.PI * 2); ctx.lineWidth = w; ctx.strokeStyle = `rgba(26,86,219,${a})`; ctx.stroke();
  });
  // Portrait, 210 × 280 box at (145, 92), "contain, centre top". Two layers of
  // the same pixels (handoff, cover "O · Ripple", revised 2026-10-09):
  // 1. Disc + lower portrait as ONE circle (200 px at (150, 162)): the photo and
  //    the blue share one clip edge, so the shoulders follow the circle exactly
  //    and no blue fringe shows.
  const s = Math.min(210 / img.width, 280 / img.height), w = img.width * s, h = img.height * s, px = 145 + (210 - w) / 2;
  ctx.save(); ctx.beginPath(); ctx.arc(250, 262, 100, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = cssLinear(ctx, 160, 150, 162, 200, 200, [[0, '#4A82EC'], [.58, '#1A56DB'], [1, '#1E429F']]); ctx.fillRect(150, 162, 200, 200);
  ctx.drawImage(img, px, 92, w, h); ctx.restore();
  // 2. Pop-out head: the portrait again, opaque down to 95 px of its box and
  //    fading out by 115 px (mask linear-gradient(180deg, #000 95px, transparent 115px));
  //    the fade sits over identical pixels, so there is no seam.
  const layer = document.createElement('canvas'); layer.width = canvas.width; layer.height = canvas.height;
  const lc = layer.getContext('2d'); lc.scale(canvas.width / A, canvas.width / A);
  lc.drawImage(img, px, 92, w, h);
  const fade = lc.createLinearGradient(0, 92 + 95, 0, 92 + 115); fade.addColorStop(0, '#000'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  lc.globalCompositeOperation = 'destination-in'; lc.fillStyle = fade; lc.fillRect(0, 0, A, A);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(layer, 0, 0); ctx.restore();
  // Logo 30 × 29 at (24, 24)
  ctx.drawImage(LOGO, 24, 24, 30, 29);
  // Title block at (24, 76)
  ctx.fillStyle = INK; ctx.font = '700 42px Inter'; ctx.letterSpacing = '-2.1px'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('Insights', 24, 111.3);
  ctx.fillStyle = TEXT2; ctx.font = '500 15px Inter'; ctx.letterSpacing = '0px';
  ctx.fillText('with Martin Motlík', 24, 138.4);
  // Tag, bottom left (24, bottom 26): 11/700/.1em, padding 5/10, pill
  ctx.font = '700 11px Inter'; ctx.letterSpacing = '1.1px';
  const tw = ctx.measureText(tag).width, th = 23.3, ty = A - 26 - th;
  ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.roundRect(24, ty, tw + 20, th, th / 2); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.textBaseline = 'middle'; ctx.fillText(tag, 34, ty + th / 2 + .5);
  ctx.restore();
}

let LOGO, PORTRAIT;
async function render(tag, size) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c, tag, PORTRAIT); return c;
}
// Exports: as a download, or (dev server only) straight to a folder
window.exportCover = async (tag, size, type = 'image/png', quality, saveAs) => {
  const c = await render(tag, size);
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  if (saveAs) { const r = await fetch('/__save/' + encodeURIComponent(saveAs), { method: 'POST', body: blob }); return r.text(); }
  return blob;
};
(async () => {
  await Promise.all(['700 42px Inter', '500 15px Inter', '700 11px Inter'].map(f => document.fonts.load(f)));
  [LOGO, PORTRAIT] = await Promise.all([load('/assets/podcast/mm-logo-dark.svg'), load('/assets/podcast/martin-portrait-1000.avif')]);
  draw(document.getElementById('show'), 'PODCAST', PORTRAIT);
  draw(document.getElementById('ep'), 'EP 01', PORTRAIT);
  draw(document.getElementById('s1'), 'EP 01', PORTRAIT);
  document.querySelectorAll('button[data-tag]').forEach(b => b.onclick = async () => {
    const blob = await exportCover(b.dataset.tag, 3000);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = b.dataset.tag === 'PODCAST' ? 'cover-3000.png' : 'cover-' + b.dataset.tag.toLowerCase().replace(' ', '') + '-3000.png'; a.click();
  });
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
